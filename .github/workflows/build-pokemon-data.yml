name: Build Pokémon data

on:
  workflow_dispatch:
  schedule:
    # Daily 16:00 UTC = 00:00 HKT (Asia/Hong_Kong)
    - cron: "0 16 * * *"

permissions:
  contents: write

concurrency:
  group: build-pokemon-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate data/pokemon.json + moves.json + meta.json
        run: node scripts/build-pokemon-data.mjs

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-data
          path: |
            data/pokemon.json
            data/moves.json
            data/meta.json
            public/data/pokemon.json
            public/data/moves.json
            public/data/meta.json

      - name: Commit updated JSON to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pokemon.json data/moves.json data/meta.json \
                  public/data/pokemon.json public/data/moves.json public/data/meta.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily CBD Doubles usage refresh (legal Champions allowlist)"
            git push origin HEAD:main
          fi
