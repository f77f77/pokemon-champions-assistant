name: Build Pokémon data

on:
  workflow_dispatch:
  schedule:
    # Daily 16:00 UTC = 00:00 HKT (Asia/Hong_Kong)
    - cron: "0 16 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: build-pokemon-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate data/pokemon.json + moves.json + meta.json
        run: node scripts/build-pokemon-data.mjs --usage-only

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-data
          path: |
            data/pokemon.json
            data/moves.json
            data/meta.json
            public/data/pokemon.json
            public/data/moves.json
            public/data/meta.json

      - name: Commit updated JSON to main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pokemon.json data/moves.json data/meta.json \
                  public/data/pokemon.json public/data/moves.json public/data/meta.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: daily CBD Doubles usage refresh (legal Champions allowlist)"
            git push origin HEAD:main
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # github-actions[bot] + default GITHUB_TOKEN cannot start `on: push`
      # workflows, so pages.yml never saw daily data commits (meta 2026-09-16
      # on main vs last Pages deploy 2026-09-12). GitHub *does* allow that
      # same token to create workflow_dispatch / repository_dispatch runs
      # (no PAT). Dispatch against branch `main` so Pages checks out the
      # commit we just pushed, not this job's original SHA.
      - name: Dispatch Deploy GitHub Pages
        if: steps.commit.outputs.committed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              ref: 'main',
            });
