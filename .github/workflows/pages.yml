name: Deploy GitHub Pages

# `on: push` still covers human / PR merges.
# Daily CBD commits use github-actions[bot] + GITHUB_TOKEN, which does not
# start subsequent `push` workflows. `Build Pokémon data` therefore calls
# createWorkflowDispatch on this file after a successful push to main
# (GITHUB_TOKEN may fire workflow_dispatch; it may not fire push).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
